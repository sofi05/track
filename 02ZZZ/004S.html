<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZZZ: Supports</title>
  <link rel="stylesheet" href="../shared/css/style.css" />
  <link rel="stylesheet" href="../shared/css/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>
  <h1>Characters</h1>
  <p id="charCount" class="char-count">
  Total: 0 characters</p>

  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Search by name..." />
    <button id="filterBtn">Filter</button>
  </div>

  <div id="filterPopup" class="filter-popup hidden">
    <!-- STATUS -->
    <div class="filter-category">
      <button type="button" class="filter-toggle">Status</button>
      <div class="filter-options">
        <div class="sub-filter">
          <label><input type="radio" name="have" value="true"> Have</label>
          <label><input type="radio" name="have" value="false"> Don't</label>
        </div>
        <div class="sub-filter">
          <label><input type="checkbox" id="filterNew"> New</label>
        </div>
      </div>
    </div>

    <!-- RARITY -->
    <div class="filter-category">
      <button type="button" class="filter-toggle">Rarity</button>
      <div class="filter-options">
        <label class="element-label">
          <input type="radio" name="rarity" value="4">
          <img src="../assets/others/Zenless/Rank/Icon_AgentRank_A.webp" class="element-img">
        </label>
        <label class="element-label">
          <input type="radio" name="rarity" value="5">
          <img src="../assets/others/Zenless/Rank/Icon_AgentRank_S.webp" class="element-img">
        </label>
      </div>
    </div>
  </div>

  <div class="char-list" id="charList"></div>
  <div id="popup-container"></div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav"></nav>

  <!--SPRITE-->
  <div id="spritePopup" class="sprite-popup" style="display:none;">
    <div class="popup-wrapper">
      <span class="close-btn">✕</span>
      <img id="spritePopupImg" src="" alt="" />
    </div>
  </div>
  <div id="spriteList"></div>

  <script src="../shared/js/common.js" defer></script>
  <script src="../shared/js/sprite-popup.js" defer></script>
  <script src="../shared/js/sup.js" defer></script>
  <script src="js/sup.js" defer></script>
  <script src="../shared/js/nav.js"></script>
</body>
</html>
