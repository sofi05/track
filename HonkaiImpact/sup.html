<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HI3: Supports</title>
  <link rel="stylesheet" href="../css.main/style.css" />
  <link rel="stylesheet" href="../css.main/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>
  <h1>Characters</h1>
  <p id="charCount" style="text-align: center; font-size: 0.8rem; margin-top: -10px; margin-bottom: 20px; color: #666;">
  Total: 0 characters</p>

  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Search by name..." />
    <button id="filterBtn">Filter</button>
  </div>

  <div class="part-toggle" id="partToggle">
    <button data-part="2" class="part-btn active">Part 2</button>
    <button data-part="1" class="part-btn">Part 1</button>
    <button data-part="all" class="part-btn">All</button>
  </div>

  <div id="filterPopup" class="filter-popup hidden">
    <!-- STATUS -->
    <div class="filter-category">
      <button type="button" class="filter-toggle">Status</button>
      <div class="filter-options">
        <div class="sub-filter">
          <label><input type="radio" name="have" value="true"> Have</label>
          <label><input type="radio" name="have" value="false"> Don't</label>
        </div>
        <div class="sub-filter">
          <label><input type="checkbox" id="filterNew"> New</label>
        </div>
      </div>
    </div>

    <!-- ELEMENT -->
    <div class="filter-category">
      <button type="button" class="filter-toggle">Element</button>
      <div class="filter-options">
        <label class="element-label">
          <input type="radio" name="element" value="Fire_DMG">
          <img src="../assets/others/HI3/Cores/Core_Fire_DMG.png" alt="Fire" class="element-img">
        </label>
        <label class="element-label">
          <input type="radio" name="element" value="Ice_DMG">
          <img src="../assets/others/HI3/Cores/Core_Ice_DMG.png" alt="Ice" class="element-img">
        </label>
        <label class="element-label">
          <input type="radio" name="element" value="Lightning_DMG">
          <img src="../assets/others/HI3/Cores/Core_Lightning_DMG.png" alt="Lightning" class="element-img">
        </label>
        <label class="element-label">
          <input type="radio" name="element" value="Physical">
          <img src="../assets/others/HI3/Cores/Core_Physical.png" alt="Physical" class="element-img">
        </label>
      </div>
    </div>

    <!-- RARITY -->
    <div class="filter-category">
      <button type="button" class="filter-toggle">Rarity</button>
      <div class="filter-options">
        <label class="element-label">
          <input type="radio" name="rarity" value="4">
          <img src="../assets/others/HI3/Rank/A.png" class="element-img">
        </label>
        <label class="element-label">
          <input type="radio" name="rarity" value="5">
          <img src="../assets/others/HI3/Rank/S.png" class="element-img">
        </label>
      </div>
    </div>
  </div>

  <div class="char-list" id="charList"></div>
  <div id="popup-container"></div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html" title="Home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
    </a>
    <a href="chara.html" id="tab-characters" title="Characters">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Characters
    </a>
    <a href="menu.html" id="tab-quests" title="Quests">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 4h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>Menu
    </a>
    <!-- <a href="mc.html" id="tab-main" title="Main">
      <img src="../assets/others/logo.png" alt="Main" class="nav-icon-image" />
      Main
    </a>-->
    <a href="#" id="tab-play" title="Switch Game">
      <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M3.75 9c-1.1 0-1.5 0.73-1.5 1.82 0 2.19 1.1 5.08 2.2 6.56s2.93 1.1 3.66 0l1.46-2.2h4.39l1.46 2.2c0.73 1.1 2.5 1.1 3.66 0s2.2-4.4 2.2-6.56c0-1.1-0.4-1.82-1.5-1.82-1.9 0-3 1.52-3.75 2.28H8.7c-0.6-0.6-1.5-1.8-3-1.8z"/></svg>Change
    </a>
  </nav>

  <div id="spritePopup" class="sprite-popup" style="display:none;">
    <span class="close-btn">✕</span>
    <img id="spritePopupImg" src="" alt="" />
  </div>
  <div id="spriteList"></div>

  <!--SPRITE-->
  <script src="js/sup.js" defer></script>
  <script src="../all-js.main/sup.js"></script>
  <script src="../all-js.main/change.js"></script>
</body>
</html>
