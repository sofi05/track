<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSR: Main Character</title>
  <link rel="stylesheet" href="../shared/css/style.css" />
  <link rel="stylesheet" href="../shared/css/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>

  <h1 id="characterName">Characters</h1> 
  <p id="charCount" class="char-count">
  Total: 0 characters</p>

  <div class="gender-toggle">
    <label class="switch">
      <input type="checkbox" id="genderToggleBtn" />
      <span class="slider2 round"></span>
    </label>
    <span id="genderLabel"></span>
    <div class="search-filter">
    </div>
  </div>

  <div class="char-list" id="charList"></div>
  <div id="popup-container"></div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav"></nav>

  <!--SPRITE-->
  <div id="spritePopup" class="popup">
    <div class="popup-content">
      <button id="prevBtn" class="nav-btn">←</button>
      
      <div class="main-img-wrapper" style="position: relative;">
        <img id="spritePopupImg" class="popup-img" />
        <button class="close-btn">✕</button> <!-- Moved inside here -->
      </div>
      
      <button id="nextBtn" class="nav-btn">→</button>
    </div>

    <!-- THUMBNAILS OUTSIDE MAIN -->
    <div id="thumbnailContainer"></div>
  </div>

  <!--SCRIPTS-->
  <script src="js/mc.js" defer></script>
  <script src="../shared/js/common.js" defer></script>
  <script src="../shared/js/sprite-popup.js" defer></script>
  <script src="../shared/js/mc.js" defer></script>
  <script src="../shared/js/nav.js"></script>
</body>
</html>
