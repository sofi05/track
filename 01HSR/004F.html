<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSR: Outfit</title>
  <link rel="stylesheet" href="../shared/css/style.css" />
  <link rel="stylesheet" href="../shared/css/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>
  <h1>Outfits</h1>
  <p id="charCount" class="char-count">
  Total: 0 characters</p>

  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Search by name..." />
    <button id="filterBtn">Filter</button>
  </div>

  <!-- FILTER -->
  <div id="filterPopup" class="filter-popup hidden">
    <div class="filter-section">
      <label><input type="checkbox" class="filter-checkbox" data-filter="have"> Have</label>
      <label><input type="checkbox" class="filter-checkbox" data-filter="want"> Don't</label>
      <label><input type="checkbox" class="filter-checkbox" data-filter="new"> New</label>
    </div>
  </div>

  <div class="char-list" id="charList"></div>
  <div id="popup-container"></div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav"></nav>

  <!--SPRITE-->
  <div id="spritePopup" class="popup">
    <div class="popup-content">
      <button id="prevBtn" class="nav-btn">←</button>
      
      <div class="main-img-wrapper" style="position: relative;">
        <img id="spritePopupImg" class="popup-img" />
        <button class="close-btn">✕</button> <!-- Moved inside here -->
      </div>
      
      <button id="nextBtn" class="nav-btn">→</button>
    </div>

    <!-- THUMBNAILS OUTSIDE MAIN -->
    <div id="thumbnailContainer"></div>
  </div>

  <script src="js/fit.js" defer></script>
  <script src="../shared/js/common.js" defer></script>
  <script src="../shared/js/sprite-popup.js" defer></script>
  <script src="../shared/js/fit.js" defer></script>
  <script src="../shared/js/nav.js"></script>
</body>
</html>
