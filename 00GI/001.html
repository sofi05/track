<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GI: Characters</title>
  <link rel="stylesheet" href="../shared/css/style.css" />
  <link rel="stylesheet" href="../shared/css/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>
  <h1>Characters</h1>
  <p id="charCount" class="char-count">
  Total: 0 characters</p>

  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Search by name..." />
    <button id="filterBtn">Filter</button>
  </div>

  <!-- Buttons are built from js/chara-page.js -->
  <div id="quickFilters" class="quick-filters"></div>
  <div id="partBar" class="part-toggle"></div>
  <div id="filterPopup" class="filter-popup hidden"></div>

  <div class="char-list" id="charList"></div>
  <div id="popup-container"></div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav"></nav>
  
    <!--SPRITE-->
  <div id="spritePopup" class="sprite-popup" style="display:none;">
    <div class="popup-wrapper">
      <span class="close-btn">✕</span>
      <img id="spritePopupImg" src="" alt="" />
    </div>
  </div>
  <div id="spriteList"></div>

  <!--SCRIPTS-->
  <script src="js/chara.js" defer></script>
  <script src="js/chara-page.js" defer></script>
  <script src="../shared/js/common.js" defer></script>
  <script src="../shared/js/sprite-popup.js" defer></script>
  <script src="../shared/js/chara-filters.js" defer></script>
  <script src="../shared/js/chara.js" defer></script>
  <script src="../shared/js/nav.js"></script>
</body>
</html>
