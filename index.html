<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HoyoDex</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">
</head>
<body>

<div class="container">
  <h1>HOYODEX</h1>

  <!-- The icons come from the GAMES list in shared/js/nav.js (add a game there, once). -->
  <div class="game-icons">
    <script src="shared/js/nav.js"></script>
    <script>
      HOYO_GAMES.forEach((g) =>
        document.write(`<a href="${g.folder}/000.html"${g.dim ? ' class="is-dim"' : ''}><img src="assets/gameico/${g.icon}" alt="${g.name}" /></a>`)
      );
    </script>
  </div>
</div>

<!-- Birthday Popup -->
<div id="popup-overlay">
  <div id="popup-content">
    <h2>Today's Birthdays 🎉</h2>
    <div id="birthday-list"></div>
    <button id="popup-close">Close</button>
  </div>
</div>

<!-- Birthday Button -->
<button id="birthday-button">🎂 Birthdays Today</button>

<!-- Load the birthday list of every game marked  bday: true  in shared/js/nav.js, then the code that shows them -->
<script>
  HOYO_GAMES.forEach((g) => g.bday && document.write(`<script src="${g.folder}/js/bday.js"><\/script>`));
  document.write('<script src="shared/js/bday.js"><\/script>');
</script>
</body>
</html>
