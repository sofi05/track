<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Honkai Impact 3rd</title>
  <link rel="stylesheet" href="../shared/css/style.css" />
  <link rel="stylesheet" href="../shared/css/bday.css" />
  <link rel="stylesheet" href="../shared/css/index.css" />
  <link rel="stylesheet" href="../shared/css/change.css" />
  <link rel="icon" type="image/png" href="https://vectorseek.com/wp-content/uploads/2023/08/Hoyoverse-Icon-Logo-Vector.svg-.png">    
</head>
<body>
  <div class="game-page">
  <div class="logo-container" align="center">
    <img src="../assets/gameico/Logo/hi3.png" alt="Honkai Impact 3rd Logo" class="game-logo" />
  </div>

    <section class="birthday-section">
      <h2>🎉 Today's Birthdays</h2>
      <div id="birthday-icons" class="birthday-icons"></div>
    </section>

    <!-- NEW -->
    <section id="new-characters">
      <h3>New Characters <small id="countdown-newchars"></small></h3>
      <div id="new-characters-slider" class="slider"></div>
    </section>

    <!-- RERUNS -->
    <section id="reruns">
      <h3>Reruns</h3>
      <div id="reruns-slider" class="slider"></div>
    </section>

    <!-- PERMANENT -->
    <section id="perma">
      <h3>Permanent</h3>
      <div id="perma-slider" class="slider"></div>
    </section>

    <!-- NAVIGATION -->
    <nav class="bottom-nav"></nav>

  <div id="popup-container"></div>

  <!-- SCRIPT -->
  <script src="../shared/js/nav.js"></script>
  <script src="js/bday.js" defer></script>
  <script src="../shared/js/bday.js" defer></script>
  <script src="js/chara.js" defer></script>
  <script src="../shared/js/vs.js" defer></script>
  <script src="../shared/js/common.js" defer></script>
  <script src="../shared/js/phase.js" defer></script>
  <script src="../shared/js/char-popup.js" defer></script>
  <script src="../shared/js/countdown.js" defer></script>
  <script src="../shared/js/home.js" defer></script>
</body>
